name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    if: >-
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:major') ||
      contains(github.event.pull_request.labels.*.name, 'release:minor') ||
      contains(github.event.pull_request.labels.*.name, 'release:patch'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve version from latest tag
        id: resolve
        shell: bash
        env:
          MAJOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}
          MINOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}
        run: |
          TAGS="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)"
          LATEST="${TAGS%%$'\n'*}"
          LATEST="${LATEST:-v0.0.0}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"

          if [[ "$MAJOR_LABEL" == "true" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$MINOR_LABEL" == "true" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^##[[:space:]]/ { found = ($2 == version || $2 == "v" version); next }
            found
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::error file=CHANGELOG.md::Brak sekcji ## $VERSION, okno What's new nie miałoby co pokazać."
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build installers
    needs: version
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build app
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ppap-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: ppap-*
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: v${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: artifacts/**/*
